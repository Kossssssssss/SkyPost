<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sky Post</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #5cb8f8; }
    body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    #game { position: fixed; inset: 0; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: bold 32px "Trebuchet MS", sans-serif; color: #fff; text-shadow: 0 3px 0 #24304a; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center;
      justify-content: center; gap: 28px; padding: 24px; text-align: center; background: linear-gradient( #93c6e8, #fbf2e0 );
      font: bold 24px "Trebuchet MS", sans-serif; color: #3a4e3a; }
    #rotate.on { display: flex; }
    #rotate .phone { width: 56px; height: 96px; border: 6px solid #3a4e3a; border-radius: 12px; animation: turn 1.8s ease-in-out infinite; }
    @keyframes turn { 0%, 25% { transform: rotate( 0deg ); } 60%, 100% { transform: rotate( -90deg ); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loading">Sky Post…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
