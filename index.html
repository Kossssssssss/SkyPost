<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sky Post</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #5cb8f8; }
    body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    #game { position: fixed; inset: 0; }
    /* Поки вантажиться код, видно ту саму карту, що й на екрані завантаження: перехід без блимання */
    #loading { position: fixed; inset: 0; background: #efe4cc url(assets/loading/map.webp) center / cover no-repeat; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loading"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
