<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Post — арт-пакети</title>
  <style>
    html, body { margin: 0; height: 100%; background: #141c30; color: #fff; font: 15px "Trebuchet MS", sans-serif; overflow: hidden; }
    #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: rgba(20,28,48,.85); z-index: 2; flex-wrap: wrap; }
    #tabs button { background: #2b3a5e; color: #fff; border: 0; border-radius: 16px; padding: 7px 14px; font: inherit; cursor: pointer; }
    #tabs button.on { background: #ff8a2a; }
    #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    #note { opacity: .8; }
    #status { color: #ffd23a; }
    #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="bar"><div id="tabs"></div><span id="note"></span><span id="status"></span></div>
  <canvas id="cv"></canvas>
  <script type="module" src="/src/packs/preview.ts"></script>
</body>
</html>
